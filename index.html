    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            -webkit-font-smoothing: antialiased;

<body class="bg-slate-50">
    <div class="bg-noise"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, Fragment } = React;

        // --- Animated Component (Scroll Reveal) ---
        const FadeIn = ({ children, delay = 0, className = "" }) => {
            const [isVisible, setIsVisible] = useState(false);
            const domRef = useRef();

            useEffect(() => {
                const observer = new IntersectionObserver(entries => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            setIsVisible(true);
                            observer.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.1 }); 

                const { current } = domRef;
                if (current) observer.observe(current);

                return () => {
                    if (current) observer.unobserve(current);
                }
            }, []);

            return (
                <div 
                    ref={domRef}
                    className={`reveal-section ${isVisible ? 'is-visible' : ''} ${className}`}
                    style={{ transitionDelay: `${delay}ms` }}
                >
                    {children}
                </div>
            );
        };

        // --- Icons ---
        const CheckIcon = ({ className = "w-5 h-5" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round"><path strokeWidth={2.5} d="M5 13l4 4L19 7" /></svg>
        );
        const ZapIcon = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round"><path strokeWidth={1.5} d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
        );
        const ShieldIcon = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round"><path strokeWidth={1.5} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
        );
        const TargetIcon = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round"><path strokeWidth={1.5} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
        );

        // --- Main App ---
        const App = () => {
            const [isScrolled, setIsScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setIsScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const scrollToDiagnosis = () => {
                document.getElementById('diagnosis')?.scrollIntoView({ behavior: 'smooth' });

                        <div className="absolute bottom-[-10%] left-[20%] w-[600px] h-[600px] bg-indigo-50/50 rounded-full mix-blend-multiply filter blur-[80px] animate-float" style={{animationDelay: '5s'}}></div>

                    {/* WHY US */}

                                    ArkCollegeが、<br/><span className="relative inline-block text-navy">
                                        選ばれる理由。
                                        <span className="absolute bottom-2 left-0 w-full h-3 bg-cta/10 -z-10 rounded-sm"></span>

                                </h2>
                                <p className="text-slate-500 font-bold text-lg sm:text-xl">圧倒的な「質」へのこだわりが、最高の結果を生みます。</p>
                            </FadeIn>
                            
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8 sm:gap-12">
                                {[
                                    { title: "Speed", jp: "圧倒的な速度", sub: "48時間以内返信、\n添削無制限", desc: "「書けない時間」をゼロに。思考を止めない圧倒的なレスポンス速度で、あなたの執筆リズムを最優先します。", icon: <ZapIcon className="w-8 h-8" />, img: "https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&q=80&w=600", delay: 0 },
                                    { title: "Quality", jp: "妥協なき品質", sub: "完全マンツーマン、\nプロ講師のみ", desc: "学生バイトは一切不在。外資系マーケター出身のプロが、あなたの「担当」として責任を持って向き合います。", icon: <ShieldIcon className="w-8 h-8" />, img: "https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&q=80&w=600", delay: 150 },
                                    { title: "Result", jp: "確かな実績", sub: "第一志望合格率 86.7%", desc: "慶應・早稲田など難関大への圧倒的な実績が、私たちの「戦略の正しさ」を何よりも証明しています。", icon: <TargetIcon className="w-8 h-8" />, img: "https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&q=80&w=600", delay: 300 }

                                    <div className="flex flex-col lg:flex-row gap-20 items-center">
                                        <div className="w-full lg:w-3/5 text-text-dark">
                                            <h2 className="text-3xl sm:text-5xl font-black mb-10 leading-tight tracking-tight">
                                                なぜ、私たちは<br/>
                                                <span className="text-navy">「1学年6名」</span>しか<br/>
                                                引き受けないのか。
                                            </h2>
                                            
                                            <div className="space-y-10">
                                                {[
                                                    { title: "品質の物理的限界", text: "「私は指導を学生バイトに外注しません。一人ひとりの人生と向き合い、細部まで責任を持つには、私が直接見る以外にないからです。その品質を維持できる物理的な限界が『6名』でした。」" },
