<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ark College | 総合型選抜の最強のパートナー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#2563EB', // blue-600
                        'navy-dark': '#1E40AF', // blue-800
                        'navy-light': '#EFF6FF', // blue-50
                        cta: '#F97316', // orange-500
                        'cta-light': '#FB923C', // orange-400
                        'cta-dark': '#EA580C', // orange-600
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.05)',
                        'glass-hover': '0 20px 50px 0 rgba(37, 99, 235, 0.15)',
                        'glow-cta': '0 10px 40px -10px rgba(249, 115, 22, 0.5)',
                        'float': '0 20px 40px -5px rgba(0,0,0,0.05), 0 10px 20px -5px rgba(0,0,0,0.02)',
                        'inner-light': 'inset 0 1px 0 0 rgba(255, 255, 255, 0.4)',
                    },
                    animation: {
                        'blob': 'blob 10s infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'shine': 'shine 3s infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        shine: {
                            '0%': { transform: 'translateX(-100%) skewX(-15deg)' },
                            '100%': { transform: 'translateX(200%) skewX(-15deg)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            -webkit-font-smoothing: antialiased;
            color: #334155;
            background-color: #F8FAFC;
            overflow-x: hidden;
        }

        /* 質感のあるノイズ背景（フラットさを消す） */
        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* リッチなグラスモーフィズム */
        .glass-rich {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.02),
                0 2px 4px -1px rgba(0, 0, 0, 0.02),
                inset 0 0 0 1px rgba(255, 255, 255, 0.5);
        }

        /* カードのホバーエフェクト強化 */
        .hover-card-lift {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .hover-card-lift:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px -5px rgba(37, 99, 235, 0.15), 0 10px 20px -5px rgba(37, 99, 235, 0.1);
            border-color: rgba(37, 99, 235, 0.2);
        }

        /* 立体的なボタン */
        .btn-3d {
            transition: all 0.2s ease;
            box-shadow: 
                0 4px 6px -1px rgba(249, 115, 22, 0.3),
                0 2px 4px -1px rgba(249, 115, 22, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }
        .btn-3d:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 10px 15px -3px rgba(249, 115, 22, 0.4),
                0 4px 6px -2px rgba(249, 115, 22, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }
        .btn-3d:active {
            transform: translateY(1px);
        }

        /* スクロールアニメーション用クラス */
        .reveal-section {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .reveal-section.is-visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-slate-50">
    <div class="bg-noise"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, Fragment } = React;

        // --- Animated Component (Scroll Reveal) ---
        const FadeIn = ({ children, delay = 0, className = "" }) => {
            const [isVisible, setIsVisible] = useState(false);
            const domRef = useRef();

            useEffect(() => {
                const observer = new IntersectionObserver(entries => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            setIsVisible(true);
                            observer.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.1 }); // 10%見えたら発火

                const { current } = domRef;
                if (current) observer.observe(current);

                return () => {
                    if (current) observer.unobserve(current);
                }
            }, []);

            return (
                <div 
                    ref={domRef}
                    className={`reveal-section ${isVisible ? 'is-visible' : ''} ${className}`}
                    style={{ transitionDelay: `${delay}ms` }}
                >
                    {children}
                </div>
            );
        };

        // --- Icons ---
        const CheckIcon = ({ className = "w-5 h-5" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round"><path strokeWidth={3} d="M5 13l4 4L19 7" /></svg>
        );
        const ZapIcon = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round"><path strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
        );
        const ShieldIcon = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round"><path strokeWidth={2} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
        );
        const TargetIcon = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round"><path strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
        );

        // --- Main App ---
        const App = () => {
            const [isScrolled, setIsScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setIsScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const scrollToDiagnosis = () => {
                document.getElementById('diagnosis')?.scrollIntoView({ behavior: 'smooth' });
            };

            return (
                <div className="relative min-h-screen">
                    {/* Background Animated Blobs (Living Background) */}
                    <div className="fixed inset-0 overflow-hidden pointer-events-none z-0">
                        <div className="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-blue-400/20 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob"></div>
                        <div className="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-purple-300/20 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob" style={{animationDelay: '2s'}}></div>
                        <div className="absolute top-[20%] left-[20%] w-[500px] h-[500px] bg-orange-200/20 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob" style={{animationDelay: '4s'}}></div>
                    </div>

                    {/* Header */}
                    <header className={`fixed top-0 left-0 right-0 z-50 transition-all duration-300 ${isScrolled ? 'bg-white/90 backdrop-blur-md shadow-sm py-3 border-b border-slate-100' : 'bg-transparent py-5'}`}>
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
                            <img src="logo.webp" alt="Ark College" className="h-8 sm:h-10 w-auto" />
                        </div>
                    </header>

                    {/* HERO SECTION */}
                    <section className="relative w-full min-h-[100svh] flex flex-col lg:flex-row items-center justify-center pt-20 lg:pt-0 overflow-hidden">
                        
                        {/* Image Side (Rich visual) */}
                        <div className="absolute top-0 left-0 w-full h-[45svh] lg:h-full lg:w-[55%] z-0">
                            <div className="absolute inset-0 bg-gradient-to-r from-blue-900/10 to-transparent mix-blend-overlay z-10"></div>
                            <img src="president.png" alt="President" className="w-full h-full object-cover object-top lg:object-center" />
                            {/* Gradient Fade for Mobile */}
                            <div className="lg:hidden absolute bottom-0 left-0 right-0 h-32 bg-gradient-to-t from-slate-50 to-transparent z-10"></div>
                            {/* Gradient Fade for PC */}
                            <div className="hidden lg:block absolute top-0 right-0 h-full w-40 bg-gradient-to-l from-slate-50 to-transparent z-10"></div>
                        </div>

                        {/* Content Side (Floating Glass) */}
                        <div className="relative z-10 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col lg:flex-row lg:justify-end items-center h-full">
                            <FadeIn className="w-full lg:w-[620px] mt-[35svh] lg:mt-0 lg:-ml-20">
                                <div className="glass-rich rounded-[32px] sm:rounded-[40px] p-8 sm:p-12 shadow-float border-t border-white/60 relative overflow-hidden group hover:shadow-glass-hover transition-all duration-500">
                                    
                                    {/* Spotlight effect behind text */}
                                    <div className="absolute -top-20 -right-20 w-64 h-64 bg-gradient-to-br from-blue-100/40 to-orange-100/40 rounded-full blur-3xl pointer-events-none group-hover:scale-110 transition-transform duration-700"></div>

                                    <span className="relative inline-block py-1.5 px-4 rounded-full bg-blue-50 text-navy font-bold text-xs tracking-wider mb-6 border border-blue-100 shadow-sm">
                                        EST. 2024 TOKYO
                                    </span>

                                    <h1 className="relative text-3xl sm:text-5xl lg:text-6xl font-black leading-tight mb-8 text-slate-800 drop-shadow-sm tracking-tight">
                                        総合型選抜の、<br />
                                        最強のパートナー、<br />
                                        <span className="text-transparent bg-clip-text bg-gradient-to-r from-navy to-navy-dark decoration-cta/40 decoration-4 underline-offset-8">Ark College</span>
                                    </h1>
                                    
                                    <div className="relative space-y-4 mb-10">
                                        {["第一志望合格率 86.7%", "添削回数 完全無制限", "48時間以内 返信確約"].map((text, i) => (
                                            <div key={i} className="flex items-center space-x-4 group/item">
                                                <div className="w-8 h-8 rounded-full bg-gradient-to-br from-cta-light to-cta flex items-center justify-center shadow-lg group-hover/item:scale-110 group-hover/item:rotate-12 transition-all duration-300">
                                                    <CheckIcon className="w-4 h-4 text-white" />
                                                </div>
                                                <span className="font-bold text-lg sm:text-xl text-slate-700 group-hover/item:text-navy transition-colors duration-300">{text}</span>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="relative space-y-5">
                                        <button onClick={scrollToDiagnosis} className="btn-3d w-full relative overflow-hidden bg-gradient-to-r from-cta to-cta-dark text-white text-xl sm:text-2xl font-bold py-5 rounded-2xl">
                                            <div className="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full animate-shine"></div>
                                            <span className="relative z-10">無料合格可能性診断を受ける</span>
                                        </button>
                                        <p className="text-xs sm:text-sm font-bold text-slate-400 text-center tracking-wider">
                                            Online Diagnosis / No Solicitation
                                        </p>
                                    </div>
                                </div>
                            </FadeIn>
                        </div>
                    </section>

                    {/* WHY US - Animated Cards */}
                    <section className="py-24 sm:py-32 relative z-10">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <FadeIn className="text-center mb-20">
                                <h2 className="text-4xl sm:text-5xl font-black mb-6 text-slate-800 tracking-tight">
                                    ArkCollegeが、<br/><span className="text-cta relative inline-block">
                                        選ばれる理由。
                                        <svg className="absolute w-full h-3 -bottom-1 left-0 text-cta/20 -z-10" viewBox="0 0 100 10" preserveAspectRatio="none"><path d="M0 5 Q 50 10 100 5" stroke="currentColor" strokeWidth="8" fill="none" /></svg>
                                    </span>
                                </h2>
                                <p className="text-slate-500 font-bold text-lg sm:text-xl">圧倒的な「質」へのこだわりが、最高の結果を生みます。</p>
                            </FadeIn>
                            
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8 sm:gap-10">
                                {[
                                    { title: "Speed", jp: "圧倒的な速度", sub: "48時間以内返信、\n添削無制限", desc: "「書けない時間」をゼロに。思考を止めない圧倒的なレスポンス速度で、あなたの執筆リズムを最優先します。", icon: <ZapIcon className="w-8 h-8" />, img: "https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&q=80&w=600", delay: 0 },
                                    { title: "Quality", jp: "妥協なき品質", sub: "完全マンツーマン、\nプロ講師のみ", desc: "学生バイトは一切不在。外資系マーケター出身のプロが、あなたの「担当」として責任を持って向き合います。", icon: <ShieldIcon className="w-8 h-8" />, img: "https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&q=80&w=600", delay: 200 },
                                    { title: "Result", jp: "確かな実績", sub: "第一志望合格率 86.7%", desc: "慶應・早稲田など難関大への圧倒的な実績が、私たちの「戦略の正しさ」を何よりも証明しています。", icon: <TargetIcon className="w-8 h-8" />, img: "https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&q=80&w=600", delay: 400 }
                                ].map((card, idx) => (
                                    <FadeIn key={idx} delay={card.delay} className="h-full">
                                        <div className="group h-full bg-white rounded-[32px] p-3 shadow-glass border border-slate-100 hover-card-lift flex flex-col">
                                            {/* Image with Gradient Overlay */}
                                            <div className="h-56 overflow-hidden rounded-[24px] relative flex-shrink-0">
                                                <div className="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent z-10 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                                                <img src={card.img} alt={card.title} className="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700" />
                                                <div className="absolute top-4 left-4 bg-white/90 backdrop-blur-sm px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-wider text-navy z-20 shadow-md">
                                                    {card.title}
                                                </div>
                                            </div>

                                            <div className="p-6 sm:p-8 flex flex-col flex-grow">
                                                <div className="flex items-center gap-4 mb-5">
                                                    <div className="w-12 h-12 rounded-2xl bg-blue-50 flex items-center justify-center text-navy shadow-inner group-hover:bg-navy group-hover:text-white transition-all duration-300 group-hover:rotate-6 scale-100 group-hover:scale-110">
                                                        {card.icon}
                                                    </div>
                                                    <h3 className="text-xl font-bold text-slate-800">{card.jp}</h3>
                                                </div>
                                                <p className="text-2xl font-bold text-navy mb-5 leading-snug">{card.sub.split('\n').map((t, i) => <Fragment key={i}>{t}<br/></Fragment>)}</p>
                                                <p className="text-slate-500 leading-relaxed text-base font-medium flex-grow">{card.desc}</p>
                                            </div>
                                        </div>
                                    </FadeIn>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* COMMITMENT SECTION (Modern Layout) */}
                    <section className="py-24 sm:py-32 relative overflow-hidden">
                         <div className="absolute inset-0 bg-gradient-to-b from-blue-50 to-white -z-10"></div>
                         
                         <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                            <FadeIn>
                                <div className="glass-rich rounded-[40px] p-8 sm:p-16 relative overflow-hidden bg-white/60">
                                    {/* Decor */}
                                    <div className="absolute top-0 right-0 w-64 h-64 bg-cta/5 rounded-full blur-3xl"></div>

                                    <div className="flex flex-col lg:flex-row gap-16 items-center">
                                        <div className="w-full lg:w-3/5 text-slate-800">
                                            <h2 className="text-3xl sm:text-5xl font-black mb-8 leading-tight tracking-tight">
                                                なぜ、私たちは<br/>
                                                <span className="text-navy relative inline-block">
                                                    「1学年6名」
                                                    <span className="absolute bottom-1 left-0 w-full h-3 bg-blue-200/50 -z-10 rounded-sm"></span>
                                                </span>
                                                しか<br/>
                                                引き受けないのか。
                                            </h2>
                                            
                                            <div className="space-y-8">
                                                {[
                                                    { title: "品質の物理的限界", text: "「私は指導を学生バイトに外注しません。一人ひとりの人生と向き合い、細部まで責任を持つには、私が直接見る以外にないからです。その品質を維持できる物理的な限界が『6名』でした。」" },
                                                    { title: "本物の思考力を養う", text: "「小手先のテクニックではなく、社会で通用する『本物の思考力』を養うには、徹底的な対話が必要です。これはマス向けの大量指導では不可能です。」" }
                                                ].map((item, i) => (
                                                    <div key={i} className="pl-6 border-l-4 border-slate-200 hover:border-cta transition-colors duration-300">
                                                        <h3 className="text-xl sm:text-2xl font-bold mb-3 flex items-center text-navy">
                                                            <span className="mr-3 text-sm font-black text-slate-300">0{i+1}</span>
                                                            {item.title}
                                                        </h3>
                                                        <p className="text-slate-600 leading-relaxed text-lg">{item.text}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="w-full lg:w-2/5 relative">
                                            <div className="relative z-10 rounded-[30px] overflow-hidden shadow-2xl rotate-3 hover:rotate-0 transition-all duration-500 border-[6px] border-white group">
                                                <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&q=80&w=800" className="object-cover w-full h-full transform group-hover:scale-105 transition-transform duration-700" />
                                            </div>
                                            <div className="absolute -bottom-6 -left-6 bg-navy text-white p-6 rounded-[20px] shadow-xl z-20 hidden sm:block animate-float">
                                                <p className="font-bold text-lg leading-tight">代表による、<br />完全直接指導</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </FadeIn>
                        </div>
                    </section>

                    {/* PROFILE */}
                    <section className="py-24 sm:py-32 bg-white relative">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center gap-16">
                            <FadeIn className="w-full md:w-1/2 relative">
                                <div className="absolute inset-0 bg-gradient-to-tr from-cta to-navy rounded-[40px] transform rotate-6 opacity-10 blur-md"></div>
                                <img src="president.png" alt="Noah M." className="relative z-10 rounded-[30px] shadow-2xl mx-auto w-full object-cover" />
                            </FadeIn>
                            
                            <FadeIn delay={200} className="w-full md:w-1/2">
                                <span className="text-cta font-bold tracking-widest uppercase text-sm mb-4 block">Representative</span>
                                <h2 className="text-4xl sm:text-6xl font-black mb-8 text-slate-800 tracking-tight">Noah M.</h2>
                                
                                <p className="text-slate-600 text-lg leading-loose mb-10 font-medium">
                                    慶應義塾大学法学部法律学科卒。欧州大学院留学。<br/>
                                    大手総合型選抜塾での4年間の指導、新規事業責任者としての組織統括を経て、外資系企業マーケターとして活躍。
                                    「受験指導」と「ビジネス戦略」を融合させた独自の指導論を持つ。
                                </p>

                                <div className="space-y-4 mb-12">
                                    <div className="bg-blue-50/50 p-5 rounded-2xl border border-blue-100 hover:bg-blue-50 transition-colors">
                                        <h4 className="font-bold text-lg text-navy mb-1">慶應義塾大学法学部 FIT入試</h4>
                                        <p className="text-slate-600 font-bold">A方式・B方式 現役ダブル合格</p>
                                    </div>
                                    <div className="p-4 border-l-4 border-slate-100">
                                        <h4 className="font-bold text-lg text-slate-700 mb-1">圧倒的な指導実績</h4>
                                        <p className="text-slate-500 font-medium">指導人数50名以上 / 合格大学31校</p>
