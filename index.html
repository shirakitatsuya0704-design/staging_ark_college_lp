<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ark College | 総合型選抜の最強のパートナー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#1e344a',
                        cta: '#B45309', 
                        'cta-light': '#D97706',
                        'cta-glow': 'rgba(180, 83, 9, 0.3)', // 発光を抑えめに
                        'navy-glow': 'rgba(30, 52, 74, 0.2)',
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
                    },
                    boxShadow: {
                        'glass': '0 4px 30px rgba(0, 0, 0, 0.05)',
                        // リッチな階層構造を持つ影（AIっぽさを消す鍵）
                        'rich': '0 10px 30px -5px rgba(30, 52, 74, 0.08), 0 4px 12px -2px rgba(30, 52, 74, 0.04)',
                        'rich-hover': '0 20px 40px -5px rgba(30, 52, 74, 0.12), 0 8px 16px -4px rgba(30, 52, 74, 0.06)',
                        'glow-cta': '0 10px 30px -5px rgba(180, 83, 9, 0.25)', // 控えめで上品な発光
                    },
                    animation: {
                        'float': 'float 8s ease-in-out infinite', // 動きをゆっくりにして高級感を出す
                        'shine': 'shine 6s infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-6px)' }, // 移動量を減らして上品に
                        },
                        shine: {
                            '0%': { transform: 'translateX(-100%) skewX(-15deg)' },
                            '20%, 100%': { transform: 'translateX(200%) skewX(-15deg)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            -webkit-font-smoothing: antialiased;
            letter-spacing: 0.04em; /* 字間を広げて余裕を持たせる */
            color: #1e344a;
            background-color: #F8FAFC;
            font-feature-settings: "palt"; /* 日本語の自動文字詰め */
        }

        /* ノイズテクスチャを加えた背景（デジタル感を消す） */
        .bg-gradient-mesh {
            background-color: #F8FAFC;
            background-image: 
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E"),
                radial-gradient(at 0% 0%, rgba(180, 83, 9, 0.03) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(30, 52, 74, 0.03) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(180, 83, 9, 0.03) 0px, transparent 50%);
            background-attachment: fixed;
        }

        /* ガラスパネルを「曇りガラス」から「上質なアクリル」風に */
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px); /* ぼかしを少し弱めてシャープに */
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03);
        }
        
        /* エッジライト効果 */
        .glass-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0) 100%);
            opacity: 0.6;
            pointer-events: none;
        }

        .glass-panel-dark {
            background: rgba(30, 52, 74, 0.9); /* 透明度を下げて重厚感を出す */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .btn-shine {
            position: relative;
            overflow: hidden;
        }
        .btn-shine::after {
            content: '';
            position: absolute;
            top: 0;
            left: -50%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-20deg);
            animation: shine 6s infinite;
        }
        
        .table-container {
            width: 100%;
        }
        @media (min-width: 640px) {
            .table-container {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
            .table-container table {
                min-width: 600px;
            }
        }
    </style>
</head>
<body class="bg-gradient-mesh">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, Fragment } = React;

        // --- Icons ---
        const CheckIcon = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M5 13l4 4L19 7" />
            </svg>
        );
        const ZapIcon = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
        );
        const ShieldIcon = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
            </svg>
        );
        const TargetIcon = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
            </svg>
        );
        const ArrowRightIcon = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
        );

        // --- Main Component ---
        const App = () => {
            const [isScrolled, setIsScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => {
                    setIsScrolled(window.scrollY > 50);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const scrollToDiagnosis = () => {
                document.getElementById('diagnosis')?.scrollIntoView({ behavior: 'smooth' });
            };

            return (
                <div className="min-h-screen overflow-x-hidden text-navy selection:bg-cta/20 selection:text-navy">
                    {/* Sticky Header */}
                    <header className={`fixed top-0 left-0 right-0 z-50 transition-all duration-500 ease-in-out ${isScrolled ? 'bg-white/90 backdrop-blur-md shadow-rich py-3 border-b border-navy/5' : 'bg-transparent py-5'}`}>
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
                            <div className="flex items-center">
                                <img src="logo.webp" alt="Ark College" className="h-7 w-auto drop-shadow-sm" />
                            </div>
                            <div className="hidden sm:block">
                                <button onClick={scrollToDiagnosis} className={`btn-shine text-xs font-bold px-6 py-2.5 rounded-full transition-all hover:-translate-y-0.5 ${isScrolled ? 'bg-cta text-white shadow-md' : 'bg-white text-cta shadow-rich'}`}>
                                    無料相談を予約する
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* FV */}
                    <section className="relative w-full min-h-[100svh] flex flex-col lg:flex-row items-center justify-center pt-20 lg:pt-0">
                        <div className="absolute top-0 left-0 w-full h-[45svh] lg:h-full lg:w-[60%] lg:left-0 overflow-hidden z-0">
                             <img src="fv.png" alt="Student Studying" className="w-full h-full object-cover object-center shadow-2xl" />
                             <div className="lg:hidden absolute bottom-0 left-0 right-0 h-24 bg-gradient-to-t from-[#F8FAFC] to-transparent"></div>
                        </div>

                        <div className="relative z-10 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col lg:flex-row lg:justify-end items-center lg:items-center h-full">
                            <div className="w-full lg:w-[500px] mt-[35svh] lg:mt-0 lg:-ml-20 glass-panel rounded-[32px] p-6 sm:p-10 shadow-rich transform transition-all hover:scale-[1.01] duration-700 border border-white/60">
                                <div className="absolute -top-10 -right-10 w-32 h-32 bg-cta/10 rounded-full blur-3xl animate-pulse"></div>
                                <h1 className="text-2xl sm:text-3xl lg:text-4xl font-bold leading-tight mb-5 text-navy tracking-wider drop-shadow-sm">
                                    総合型選抜<br />
                                    最強のパートナー、<br />
                                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-navy to-cta decoration-cta decoration-2 underline-offset-4">Ark College</span>
                                </h1>
                                <div className="space-y-2.5 mb-6">
                                    {["第一志望合格率 86.7%", "添削回数 完全無制限", "48時間以内 返信確約"].map((text, i) => (
                                        <div key={i} className="flex items-center space-x-2.5 group">
                                            <div className="w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-gradient-to-br from-cta to-cta-light flex items-center justify-center shadow-sm group-hover:scale-110 transition-transform duration-300">
                                                <CheckIcon className="w-2.5 h-2.5 text-white" />
                                            </div>
                                            <span className="font-bold text-xs sm:text-sm text-navy/90 tracking-tight group-hover:text-cta transition-colors duration-300">{text}</span>
                                        </div>
                                    ))}
                                </div>
                                <div className="space-y-2">
                                    <div className="flex justify-center mb-1">
                                        <span className="bg-red-600 text-white px-3 py-1 text-[10px] font-bold rounded-full shadow-sm animate-pulse">
                                            2026年度 新規受入 残りわずか / 1学年6名限定
                                        </span>
                                    </div>
                                    <button onClick={scrollToDiagnosis} className="btn-shine w-full bg-gradient-to-r from-cta to-cta-light text-white text-sm sm:text-base font-bold py-3.5 rounded-xl shadow-glow-cta hover:shadow-rich-hover hover:-translate-y-0.5 transition-all duration-300 tracking-wide">
                                        とりあえず無料相談に申し込む
                                    </button>
                                    <div className="text-center space-y-0.5">
                                        <p className="text-[9px] sm:text-[10px] font-bold text-cta tracking-wide">
                                            今の実力がわかるフィードバックシートをプレゼント
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Why Us */}
                    <section className="pt-16 sm:pt-28 pb-10 relative overflow-hidden">
                        <div className="absolute top-1/2 left-0 w-[500px] h-[500px] bg-cta/5 rounded-full blur-[100px] -translate-y-1/2 -translate-x-1/2 pointer-events-none"></div>

                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                            <div className="text-center mb-12 sm:mb-20">
                                <h2 className="text-2xl sm:text-4xl font-black tracking-tight mb-3 text-navy leading-none">
                                    ArkCollegeが、<br/><span className="text-transparent bg-clip-text bg-gradient-to-r from-cta to-cta-light">選ばれる理由。</span>
                                </h2>
                            </div>
                            
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-5 sm:gap-8 mb-12">
                                {[
                                    { sub: "48時間以内返信、\n添削無制限", desc: "圧倒的なレスポンス速度で、改善サイクルを最速で回します。", icon: <ZapIcon className="w-5 h-5" />, img: "student_2.png" },
                                    { sub: "完全マンツーマン、\nプロ講師のみ", desc: "学生バイトは不在。プロ講師のみが担任として責任を持って向き合います。", icon: <ShieldIcon className="w-5 h-5" />, img: "Class_2.png" },
                                    { sub: "第一志望\n合格率 86.7%", desc: "難関大への圧倒的な実績。安心してお任せください。", icon: <TargetIcon className="w-5 h-5" />, img: "College.png" }
                                ].map((card, idx) => (
                                    <div key={idx} className="group relative bg-white rounded-[20px] p-2 shadow-rich hover:shadow-rich-hover transition-all duration-500 hover:-translate-y-1 border border-slate-200/60">
                                        <div className="absolute inset-0 bg-gradient-to-br from-slate-50/50 to-white rounded-[20px] -z-10"></div>
                                        <div className="h-36 overflow-hidden rounded-[16px] relative">
                                            <div className="absolute inset-0 bg-navy/10 group-hover:bg-transparent transition-all duration-500 z-10"></div>
                                            <img src={card.img} alt={card.sub} className="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-700" />
                                        </div>
                                        <div className="p-4 relative">
                                            <div className="flex items-start gap-2.5 mb-2.5">
                                                <div className="w-8 h-8 rounded-lg bg-slate-50 flex items-center justify-center text-cta shadow-sm group-hover:bg-cta group-hover:text-white transition-colors duration-300 border border-slate-100 flex-shrink-0">
                                                    {card.icon}
                                                </div>
                                                <h3 className="text-base font-bold text-navy leading-snug pt-0.5">
                                                    {card.sub.split('\n').map((t, i) => <Fragment key={i}>{t}<br/></Fragment>)}
                                                </h3>
                                            </div>
                                            <p className="text-slate-600 leading-relaxed text-xs font-medium">{card.desc}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Case Studies */}
                    <section className="py-16 sm:py-24 bg-white relative border-t border-slate-100">
                        <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                            <div className="text-center mb-10">
                                <span className="text-cta font-bold tracking-widest uppercase text-[10px] mb-2 block">Case Study</span>
                                <h2 className="text-2xl sm:text-3xl font-black mb-3 text-navy tracking-tight">数字の裏にある<br />一人ひとりの戦略とは</h2>
                                <p className="text-slate-500 text-sm font-bold">逆転合格には、必ず理由があります。</p>
                            </div>

                            <div className="grid md:grid-cols-2 gap-6">
                                {/* Case 1 */}
                                <div className="glass-panel p-6 sm:p-8 rounded-[24px] shadow-rich border-l-4 border-cta relative overflow-hidden group hover:-translate-y-1 transition-transform duration-300">
                                    <div className="flex items-center justify-between mb-6">
                                        <div className="flex items-center gap-3">
                                            <img src="boy.png" alt="K.S.さん" className="w-12 h-12 rounded-full object-cover border-2 border-white shadow-sm" />
                                            <div>
                                                <p className="text-sm font-bold text-navy">K.S.さん</p>
                                                <p className="text-[10px] text-slate-500">私立高校3年生</p>
                                            </div>
                                        </div>
                                        <div className="bg-slate-100 px-3 py-1 rounded-full text-[10px] font-black text-slate-400">CASE 01</div>
                                    </div>
                                    
                                    <h3 className="text-lg sm:text-xl font-black text-navy mb-4">慶應義塾大学 法学部 FIT入試 合格</h3>
                                    
                                    <div className="bg-slate-50 rounded-xl p-4 mb-4 border border-slate-100">
                                        <p className="text-[10px] font-bold text-slate-400 mb-1 uppercase tracking-widest">Before</p>
                                        <div className="text-xs sm:text-sm font-medium text-slate-600 space-y-1">
                                            <div className="flex items-center gap-2"><span className="w-1.5 h-1.5 rounded-full bg-slate-300"></span>評定平均 3.8 / 実績なし</div>
                                            <div className="flex items-center gap-2"><span className="w-1.5 h-1.5 rounded-full bg-slate-300"></span>文章力に自信なし</div>
                                        </div>
                                    </div>

                                    <div>
                                        <p className="text-[10px] font-bold text-cta mb-1 uppercase tracking-widest">Strategy</p>
                                        <p className="text-xs sm:text-sm font-medium text-navy leading-relaxed">
                                            「強みがない」と悩んでいたが、徹底的な自己分析で隠れた原法意識を発掘。その意識を元にした論理構成をプロ講師とともに再構築し、法学部の教授を唸らせる志望理由書へ昇華。見事FIT合格を果たした。
                                        </p>
                                    </div>
                                </div>

                                {/* Case 2 */}
                                <div className="glass-panel p-6 sm:p-8 rounded-[24px] shadow-rich border-l-4 border-navy relative overflow-hidden group hover:-translate-y-1 transition-transform duration-300">
                                    <div className="flex items-center justify-between mb-6">
                                        <div className="flex items-center gap-3">
                                            <img src="girl.png" alt="M.T.さん" className="w-12 h-12 rounded-full object-cover border-2 border-white shadow-sm" />
                                            <div>
                                                <p className="text-sm font-bold text-navy">M.T.さん</p>
                                                <p className="text-[10px] text-slate-500">公立高校3年生</p>
                                            </div>
                                        </div>
                                        <div className="bg-slate-100 px-3 py-1 rounded-full text-[10px] font-black text-slate-400">CASE 02</div>
                                    </div>

                                    <h3 className="text-lg sm:text-xl font-black text-navy mb-4">早稲田大学 国際教養学部 AO入試 合格</h3>
                                    
                                    <div className="bg-slate-50 rounded-xl p-4 mb-4 border border-slate-100">
                                        <p className="text-[10px] font-bold text-slate-400 mb-1 uppercase tracking-widest">Before</p>
                                        <div className="text-xs sm:text-sm font-medium text-slate-600 space-y-1">
                                            <div className="flex items-center gap-2"><span className="w-1.5 h-1.5 rounded-full bg-slate-300"></span>海外経験あり / 英語力あり</div>
                                            <div className="flex items-center gap-2"><span className="w-1.5 h-1.5 rounded-full bg-slate-300"></span>日本の受験システムへの不安</div>
                                        </div>
                                    </div>

                                    <div>
                                        <p className="text-[10px] font-bold text-navy mb-1 uppercase tracking-widest">Strategy</p>
                                        <p className="text-xs sm:text-sm font-medium text-navy leading-relaxed">
                                            英語力に頼りきりだった内容を、大学のアドミッション・ポリシーに基づき「なぜ早稲田か」をマーケティング視点で尖らせ、差別化に成功。
                                        </p>
                                    </div>
                                </div>
                            </div>

                            <div className="mt-10 text-center">
                                <button onClick={scrollToDiagnosis} className="inline-flex items-center gap-2 text-navy font-bold text-sm border-b-2 border-cta pb-0.5 hover:text-cta transition-colors">
                                    <span>自分だけの合格戦略を作成する</span>
                                    <ArrowRightIcon className="w-4 h-4" />
                                </button>
                            </div>
                        </div>
                    </section>

                    {/* Correction Quality */}
                    <section className="py-16 sm:py-24 bg-slate-50 relative overflow-hidden">
                         <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                            <div className="text-center mb-10">
                                <span className="text-cta font-bold tracking-widest uppercase text-[10px] mb-2 block">Quality of Feedback</span>
                                <h2 className="text-2xl sm:text-3xl font-black mb-3 text-navy tracking-tight">Ark College流の添削</h2>
                                <p className="text-slate-500 text-sm font-bold">高密度なフィードバックを、48時間以内に。</p>
                            </div>

                            <div className="grid md:grid-cols-2 gap-6 items-stretch">
                                {/* Bad Example */}
                                <div className="bg-slate-50 rounded-[24px] p-6 shadow-inner border border-slate-200 grayscale relative">
                                    <div className="absolute top-4 left-4 bg-slate-300 text-slate-700 px-3 py-1 rounded-full text-[10px] font-bold">Before：感想文</div>
                                    <div className="mt-8 space-y-4">
                                        <div className="bg-white p-4 rounded-xl rounded-tl-none text-xs text-slate-700 leading-relaxed border border-slate-200 shadow-sm">
                                            <p className="font-bold mb-1 text-[10px] text-slate-600">志望理由：</p>
                                            「私は海辺の街で育ちました。最近海が汚れているのを見て悲しくなりました。だから私は海をきれいにするために、この大学で環境学を学びたいです。」
                                        </div>
                                    </div>
                                    <p className="text-center text-xs font-bold text-slate-600 mt-6">感情論のみで「論理」がない</p>
                                </div>

                                {/* Ark College Example */}
                                <div className="bg-white rounded-[24px] p-6 shadow-rich border-2 border-cta relative overflow-hidden">
                                    <div className="absolute top-4 left-4 bg-cta text-white px-3 py-1 rounded-full text-[10px] font-bold">After：論理的構成</div>
                                    <div className="mt-8 space-y-4">
