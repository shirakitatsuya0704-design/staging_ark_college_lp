<!DOCTYPE html>
<html lang="ja">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // 指定のカラーコード
                        navy: '#1e344a',
                        // サブテキスト用（少し淡く）
                        'navy-light': '#475569',
                        cta: '#B45309',
                        'cta-light': '#D97706',

                    },

                        sans: ['Inter', 'Noto Sans JP', 'sans-serif'],

                        'subtle': '0 10px 30px -10px rgba(30, 52, 74, 0.1)',
                        'glow-cta': '0 10px 30px -5px rgba(180, 83, 9, 0.4)',

                        'float': 'float 6s ease-in-out infinite',

                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },

                        shine: {

    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            -webkit-font-smoothing: antialiased;
            letter-spacing: 0.04em;
            color: #1e344a; /* 指定色 */
            background-color: #F8FAFC;
        }

        /* 繊細な背景グラデーション */
        .bg-gradient-mesh {
            background-color: #fcfdfe;
            background-image:

                radial-gradient(at 100% 100%, rgba(30, 52, 74, 0.03) 0px, transparent 50%);
        }

        /* Glassmorphism Refined (よりクリアで上品に) */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .glass-panel-dark {
            background: rgba(30, 52, 74, 0.95);

            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* ボタンの光沢アニメーション */
        .btn-shine {
            position: relative;
            overflow: hidden;
        }
        .btn-shine::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);

</head>
<body class="bg-gradient-mesh">
