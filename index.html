<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ark College | 総合型選抜の最強のパートナー</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

            theme: {

                    colors: {
                        navy: '#0F172A',
                        cta: '#B45309',

    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            -webkit-font-smoothing: antialiased;
            letter-spacing: 0.02em;
            color: #0F172A;
        }
        /* ターゲット層向けの視認性向上 */
        .large-text-body { font-size: 1.5rem; line-height: 1.8; }

</head>
<body class="bg-white">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, Fragment } = React;

        // Icons
        const CheckIcon = ({ className = "w-5 h-5" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">

            </svg>
        );

            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
        );

        const ShieldIcon = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
            </svg>
        );

        const TargetIcon = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">

            </svg>
        );

        const App = () => {
            const [isScrolled, setIsScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => {
                    setIsScrolled(window.scrollY > 50);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const scrollToDiagnosis = () => {
                document.getElementById('diagnosis')?.scrollIntoView({ behavior: 'smooth' });
            };

            return (
                <div className="min-h-screen">
                    {/* Sticky Header */}

                                        </div>
                                    ))}
                                </div>

                                    </button>

                                        診断はオンラインで完結 / 強引な勧誘、なし
                                    </p>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Why Us */}

                                </h2>
                                <div className="h-3 w-24 sm:w-48 bg-cta mx-auto"></div>
                            </div>

                                {[
                                    { title: "Speed (速度)", sub: "48時間以内返信、\n添削無制限", desc: "「書けない時間」をゼロに。思考を止めない圧倒的なレスポンス速度で、あなたの執筆リズムを最優先します。", icon: <ZapIcon className="w-10 h-10 sm:w-14 sm:h-14" />, img: "https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&q=80&w=600" },

                                    { title: "Result (実績)", sub: "第一志望合格率 86.7%", desc: "慶應・早稲田など難関大への圧倒的な実績が、私たちの「戦略の正しさ」を何よりも証明しています。", icon: <TargetIcon className="w-10 h-10 sm:w-14 sm:h-14" />, img: "https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&q=80&w=600" }
                                ].map((card, idx) => (
                                    <div key={idx} className="bg-white rounded-[40px] sm:rounded-[60px] shadow-xl border border-slate-200 overflow-hidden flex flex-col transition-transform hover:scale-[1.02]">

                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Commitment */}

                                <div className="w-full lg:w-3/5">
                                    <h2 className="text-4xl sm:text-7xl font-black mb-12 leading-tight text-center lg:text-left tracking-tight">なぜ、私たちは、「1学年6名」しか、引き受けないのか。</h2>
                                    <p className="text-2xl sm:text-4xl text-cta font-black mb-16 text-center lg:text-left tracking-wide underline underline-offset-8">合格の先を見据えるプロが、「厳選」にこだわる真意。</p>
                                    <div className="space-y-12">

                                        ].map((item, i) => (
                                            <div key={i} className="bg-white/10 border border-white/20 p-10 sm:p-16 rounded-[40px] sm:rounded-[60px] shadow-2xl backdrop-blur-sm">
                                                <h3 className="text-3xl sm:text-5xl font-black mb-8 flex items-center"><span className="text-cta mr-8 text-5xl sm:text-7xl">0{i+1}.</span>{item.title}</h3>
                                                <p className="text-slate-300 leading-relaxed text-2xl sm:text-4xl font-medium">{item.text}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="w-full lg:w-2/5">
                                    <div className="relative group max-w-lg mx-auto">
                                        <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&q=80&w=800" className="rounded-[40px] sm:rounded-[60px] shadow-2xl grayscale brightness-90 border border-white/10" />
                                        <div className="absolute -bottom-10 -left-10 bg-cta p-10 sm:p-14 rounded-[30px] sm:rounded-[40px] shadow-2xl hidden sm:block">
                                            <p className="text-white font-black text-3xl sm:text-5xl leading-tight">代表による、<br />完全直接指導</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Representative Profile */}
                    <section className="py-24 sm:py-40 bg-white">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center gap-16 sm:gap-24">
                            <div className="w-full md:w-1/2">
                                <img src="president.webp" alt="Noah M." className="rounded-[40px] sm:rounded-[60px] shadow-2xl transition-all duration-700 mx-auto max-w-[550px] w-full border border-slate-100" />
                            </div>
                            <div className="w-full md:w-1/2 text-center sm:text-left">
                                <span className="text-cta font-black tracking-widest uppercase text-xl sm:text-2xl mb-6 block">Representative</span>
                                <h2 className="text-6xl sm:text-8xl font-black mb-12 tracking-tight">Noah M.</h2>
                                <div className="space-y-8 mb-16">
                                    <div className="border-l-[12px] border-cta pl-8 py-4 text-left"><p className="font-black text-3xl sm:text-5xl leading-tight">慶應義塾大学 FIT入試、<br />両方式現役合格</p></div>
                                    <div className="border-l-[12px] border-slate-200 pl-8 py-4 text-left"><p className="font-bold text-2xl sm:text-4xl text-slate-700">外資系企業マーケターとして活躍</p></div>
                                    <div className="border-l-[12px] border-slate-200 pl-8 py-4 text-left"><p className="font-bold text-2xl sm:text-4xl text-slate-700">50名以上を難関大へ輩出</p></div>
                                </div>
                                <div className="bg-slate-50 p-10 sm:p-14 rounded-[30px] sm:rounded-[40px] italic text-navy leading-relaxed relative text-2xl sm:text-4xl font-black border border-slate-100 shadow-sm text-left">
                                    <span className="absolute -top-10 -left-6 text-9xl text-slate-200 font-serif opacity-50">“</span>
                                    「1学年6名限定。私が全責任を持って担当します。社会で通用する思考力を養いましょう。」
                                </div>
                            </div>
                        </div>
                    </section>

                    <section className="py-24 sm:py-40 bg-white">
                        <div className="max-w-6xl mx-auto px-4">
                            <div className="text-center mb-24">
                                <h2 className="text-4xl sm:text-7xl font-black mb-8 text-navy tracking-tight">料金・プラン</h2>
                                <p className="text-slate-500 text-2xl sm:text-4xl font-bold italic underline decoration-cta decoration-4">不透明な追加費用は一切ありません。</p>
                            </div>
                            
                            {/* Comparison Table Desktop */}
                            <div className="hidden lg:block shadow-2xl rounded-[60px] border border-slate-100 overflow-hidden">
                                <table className="w-full border-collapse">
                                    <thead>
                                        <tr className="border-b-4 border-slate-100 text-2xl">
                                            <th className="p-12 text-left font-black text-slate-400 uppercase tracking-widest">サービス内容</th>
                                            <th className="p-12 bg-navy text-white text-center font-black">Ark College</th>
                                            <th className="p-12 text-center font-black text-slate-400">大手他社</th>
                                        </tr>
                                    </thead>
                                    <tbody className="text-3xl font-black">
                                        <tr className="bg-amber-50/70 border-b-2 border-slate-100">
                                            <td className="p-12 border-l-[16px] border-cta">総額目安<br/><span className="text-base font-bold text-slate-400">(合格まで)</span></td>
                                            <td className="p-12 text-center bg-navy text-cta text-5xl">約80万円</td>
                                            <td className="p-12 text-center text-slate-400 line-through">約120万円</td>
                                        </tr>
                                        <tr className="border-b-2 border-slate-100">
                                            <td className="p-12 text-slate-700">月額費用</td>
                                            <td className="p-12 text-center bg-navy text-white text-4xl">約8.5万円〜</td>
                                            <td className="p-12 text-center text-slate-500 text-2xl font-bold">約7万円〜</td>
                                        </tr>

                                        <div className="flex justify-between items-center"><span className="text-slate-400 text-lg uppercase font-bold">添削</span><span className="text-white text-3xl font-black">完全無制限</span></div>
                                    </div>
                                </div>
                            </div>

                            <div className="mt-20 bg-amber-50 border-4 border-cta border-dashed p-10 sm:p-20 rounded-[40px] text-center shadow-inner">
                                <p className="text-cta font-black text-3xl sm:text-6xl mb-10 tracking-tight">早期特典キャンペーン中</p>
