    <script type="text/babel">

            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />

                                    EST. 2024 TOKYO
                                </span>

                                <h1 className="text-3xl sm:text-5xl lg:text-6xl font-black leading-tight mb-6 sm:mb-10 text-navy tracking-tighter drop-shadow-sm">
                                    総合型選抜<br />
                                    最強のパートナー<br />
                                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-navy to-cta decoration-cta decoration-4 underline-offset-8">Ark College</span>
                                </h1>
                                
                                <div className="space-y-3 sm:space-y-5 mb-8 sm:mb-12">
                                    {["第一志望合格率 86.7%", "添削回数 完全無制限", "48時間以内 返信確約"].map((text, i) => (
                                        <div key={i} className="flex items-center space-x-3 sm:space-x-5 group">
                                            <div className="w-6 h-6 sm:w-8 sm:h-8 rounded-full bg-gradient-to-br from-cta to-cta-light flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform duration-300">
                                                <CheckIcon className="w-3 h-3 sm:w-4 sm:h-4 text-white" />
                                            </div>
                                            <span className="font-bold text-base sm:text-xl text-navy tracking-tight group-hover:text-cta transition-colors duration-300">{text}</span>
                                        </div>
                                    ))}
                                </div>

                                <div className="space-y-4">
                                    <button onClick={scrollToDiagnosis} className="btn-shine w-full bg-gradient-to-r from-cta to-cta-light text-white text-lg sm:text-2xl font-black py-4 sm:py-6 rounded-2xl shadow-glow-cta hover:shadow-xl hover:-translate-y-1 transition-all duration-300">
                                        無料合格可能性診断を受ける
                                    </button>
                                    <p className="text-xs sm:text-sm font-bold text-slate-400 text-center tracking-widest uppercase">
                                        Online Diagnosis / No Solicitation
                                    </p>
                                </div>
                            </div>

                    {/* Why Us (Editorial Layout) */}
                    <section className="py-24 sm:py-40 relative overflow-hidden">

                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                            <div className="text-center mb-20 sm:mb-32">
                                <h2 className="text-4xl sm:text-6xl font-black tracking-tighter mb-8 text-navy leading-none">
                                    ArkCollegeが<br/><span className="text-transparent bg-clip-text bg-gradient-to-r from-cta to-cta-light">選ばれる理由</span>
                                </h2>
                                <p className="text-slate-500 font-bold text-lg sm:text-xl">圧倒的な「質」と「量」へのこだわり。</p>
                            </div>
                            
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8 sm:gap-12">
                                {[
                                    { title: "Speed", jp: "圧倒的スピード", sub: "48時間以内返信、\n添削無制限", desc: "「書けない時間」をゼロに。思考を止めない圧倒的なレスポンス速度で、PDCAを最速にします。", icon: <ZapIcon className="w-8 h-8" />, img: "https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&q=80&w=600" },
                                    { title: "Quality", jp: "妥協なき品質", sub: "完全マンツーマン、\nプロ講師のみ", desc: "学生バイトは一切不在。外資系マーケター出身のプロが、「担任」として責任を持って向き合います。", icon: <ShieldIcon className="w-8 h-8" />, img: "https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&q=80&w=600" },

                                        <div className="h-64 overflow-hidden rounded-[24px] relative">

                                    </div>

                            </div>
                        </div>

                                        <div className="space-y-10">
                                            {[
                                                { title: "品質の物理的限界", text: "「学生バイトはいません。一人ひとりの人生と向き合い、細部まで責任を持つには、プロが直接見る以外にないと思います。その物理的な限界が『6名』でした。」" },
                                                { title: "本物の思考力を養う", text: "「小手先のテクニックではなく、社会で通用する『本物の思考力』を養うには、徹底的な対話が必要です。これは大量指導では不可能です。」" }
                                            ].map((item, i) => (
                                                <div key={i} className="pl-6 border-l border-white/20">
                                                    <h3 className="text-2xl sm:text-3xl font-black mb-4 flex items-center text-white"><span className="text-cta mr-4 text-sm align-top">0{i+1}</span>{item.title}</h3>
                                                    <p className="text-slate-400 leading-relaxed text-lg">{item.text}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="w-full lg:w-2/5 relative">
                                        <div className="relative z-10 rounded-[30px] overflow-hidden shadow-2xl border border-white/10 rotate-3 transition-transform hover:rotate-0 duration-500">

                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center gap-16">
                            <div className="w-full md:w-1/2 relative">
                                <div className="absolute inset-0 bg-gradient-to-tr from-cta to-navy rounded-[40px] transform rotate-6 opacity-10"></div>
                                <img src="president.png" alt="Noah M." className="relative z-10 rounded-[30px] shadow-2xl mx-auto w-full object-cover grayscale hover:grayscale-0 transition-all duration-700" />
                            </div>
                            <div className="w-full md:w-1/2">
                                <span className="text-cta font-bold tracking-widest uppercase text-sm mb-4 block">Representative</span>
                                <h2 className="text-5xl sm:text-7xl font-black mb-10 tracking-tight text-navy">Noah M.</h2>
                                <div className="space-y-6 mb-12">
                                    <div className="border-l-[6px] border-cta pl-6 py-2"><p className="font-bold text-2xl sm:text-3xl text-navy">慶應義塾大学 FIT入試、<br />両方式現役合格</p></div>
                                    <div className="border-l-[6px] border-slate-200 pl-6 py-2"><p className="font-bold text-xl sm:text-2xl text-slate-500">外資系企業マーケターとして活躍</p></div>
                                    <div className="border-l-[6px] border-slate-200 pl-6 py-2"><p className="font-bold text-xl sm:text-2xl text-slate-500">50名以上を難関大へ輩出</p></div>
                                </div>

                                </div>
