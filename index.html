<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ark College | 総合型選抜の最強のパートナー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // 【変更点】重たい紺色から、知的で鮮やかなロイヤルブルーへ
                        navy: '#2563EB', // blue-600 base
                        'navy-dark': '#1D4ED8', // blue-700
                        'navy-light': '#EFF6FF', // blue-50
                        
                        // 【変更点】茶色系から、元気が出るビタミンオレンジへ
                        cta: '#F97316', // orange-500
                        'cta-light': '#FB923C', // orange-400
                        'cta-glow': 'rgba(249, 115, 22, 0.4)',
                        'navy-glow': 'rgba(37, 99, 235, 0.25)',
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
                    },
                    boxShadow: {
                        // 【変更点】黒い影をやめ、青み/オレンジみのある透明感のある影へ
                        'glass': '0 8px 32px 0 rgba(37, 99, 235, 0.1)',
                        'soft-blue': '0 20px 40px -10px rgba(37, 99, 235, 0.15)',
                        'glow-cta': '0 15px 35px -5px rgba(249, 115, 22, 0.4)',
                        'card-hover': '0 25px 50px -12px rgba(37, 99, 235, 0.15)',
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'shine': 'shine 4s infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        shine: {
                            '0%': { transform: 'translateX(-100%) skewX(-15deg)' },
                            '20%, 100%': { transform: 'translateX(200%) skewX(-15deg)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            -webkit-font-smoothing: antialiased;
            letter-spacing: 0.02em; /* 【変更点】詰めすぎない */
            color: #334155; /* text-slate-700 */
            background-color: #F8FAFC;
        }

        /* 背景：明るく爽やかなグラデーション */
        .bg-gradient-mesh {
            background-color: #ffffff;
            background-image: 
                radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(249, 115, 22, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(37, 99, 235, 0.05) 0px, transparent 50%);
        }

        /* Glassmorphism: より明るく、清潔感のある白ベース */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 40px -10px rgba(37, 99, 235, 0.1);
        }

        /* ボタンのエフェクト */
        .btn-shine {
            position: relative;
            overflow: hidden;
        }
        .btn-shine::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.5) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-15deg);
            animation: shine 4s infinite;
        }
        
        /* ユーティリティ */
        .text-gradient {
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            background-image: linear-gradient(to right, #2563EB, #1D4ED8);
        }
    </style>
</head>
<body class="bg-gradient-mesh">
    <div id="root"></div>

                                        </h2>
