<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ark College | 総合型選抜の最強のパートナー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#0F172A',
                        cta: '#B45309',
                        'cta-light': '#D97706',
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.15)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            -webkit-font-smoothing: antialiased;
            letter-spacing: 0.02em;
            color: #0F172A;
        }
        /* 背景に質感を与える */
        .bg-pattern {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="bg-pattern">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, Fragment } = React;

        // Icons (そのままでOK)
        const CheckIcon = ({ className = "w-5 h-5" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" />
            </svg>
        );
        const ZapIcon = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
        );
        const ShieldIcon = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
            </svg>
        );
        const TargetIcon = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
            </svg>
        );

        const App = () => {
            const [isScrolled, setIsScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => {
                    setIsScrolled(window.scrollY > 50);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const scrollToDiagnosis = () => {
                document.getElementById('diagnosis')?.scrollIntoView({ behavior: 'smooth' });
            };

            return (
                <div className="min-h-screen overflow-x-hidden">
                    {/* Header */}
                    <header className={`fixed top-0 left-0 right-0 z-50 transition-all duration-300 ${isScrolled ? 'bg-white/90 backdrop-blur-md shadow-sm py-3' : 'bg-transparent py-4'}`}>
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
                            <div className="flex items-center">
                                <img src="logo.webp" alt="Ark College" className="h-8 sm:h-12 w-auto" />
                            </div>
                        </div>
                    </header>

                    {/* FV: Adjusted Layout */}
                    <section className="relative w-full min-h-[90svh] flex flex-col lg:flex-row bg-white">
                        {/* 【修正ポイント1】背景画像エリア
                            PC: 右側半分にはみ出さないよう左寄せ (object-left)
                            Mobile: 高さを調整し、object-positionを上部(object-top)に合わせて顔切れを防ぐ
                        */}
                        <div className="lg:absolute lg:inset-0 lg:z-0 h-[50vh] lg:h-full w-full overflow-hidden">
                             <img 
                                src="president.png" 
                                alt="President" 
                                className="w-full h-full object-cover object-top lg:object-left" 
                             />
                             {/* PCのみ：画像の上に薄いグラデーションをかけて文字の可読性を上げる（万が一被ったとき用） */}
                             <div className="hidden lg:block absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-white/90"></div>
                        </div>

                        {/* 【修正ポイント2】コンテンツカードエリア 
                            PC: 右側に固定し、画像の人物（左側）と被らないように配置
                            Mobile: ネガティブマージン (-mt-20) で画像を少し隠すように重ね、一体感を出す
                        */}
                        <div className="relative z-10 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col justify-center lg:items-end -mt-20 lg:mt-0 lg:h-auto lg:min-h-screen pb-12">
                            
                            {/* Card Container: Glassmorphism & Shadow */}
                            <div className="bg-white/90 backdrop-blur-xl shadow-glass border border-white/50 rounded-[30px] sm:rounded-[40px] p-8 sm:p-14 lg:max-w-[600px] w-full transform transition-all hover:scale-[1.01] duration-500">
                                <h1 className="text-3xl sm:text-5xl lg:text-6xl font-black leading-[1.1] mb-8 text-navy tracking-tighter drop-shadow-sm">
                                    総合型選抜の、<br />
                                    最強のパートナー、<br />
                                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-navy to-cta underline decoration-cta decoration-4 underline-offset-8">Ark College</span>
                                </h1>
                                
                                <div className="space-y-4 mb-10">
                                    {["第一志望合格率 86.7%", "添削回数 完全無制限", "48時間以内 返信確約"].map((text, i) => (
                                        <div key={i} className="flex items-center space-x-4 bg-white border border-slate-100 rounded-2xl p-4 shadow-md hover:shadow-lg transition-shadow">
                                            <div className="bg-gradient-to-br from-cta to-cta-light rounded-full p-1.5 shrink-0 shadow-sm"><CheckIcon className="w-4 h-4 text-white" /></div>
                                            <span className="font-bold text-lg sm:text-xl text-navy tracking-tight">{text}</span>
                                        </div>
                                    ))}
                                </div>

                                <div className="space-y-4">
                                    <button onClick={scrollToDiagnosis} className="w-full bg-gradient-to-r from-cta to-cta-light hover:from-amber-700 hover:to-amber-600 text-white text-xl sm:text-2xl font-black py-5 rounded-2xl transition-all shadow-xl hover:shadow-2xl hover:-translate-y-1 active:scale-95 relative overflow-hidden group">
                                        <span className="relative z-10">無料合格可能性診断を受ける</span>
                                        {/* キラッと光るエフェクト */}
                                        <div className="absolute top-0 -left-[100%] w-full h-full bg-white/20 skew-x-[-20deg] group-hover:left-[100%] transition-all duration-500 ease-in-out"></div>
                                    </button>
                                    <p className="text-sm sm:text-base font-bold text-slate-500 text-center">
                                        診断はオンラインで完結 / 強引な勧誘、なし
                                    </p>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Why Us (背景に少しアクセント追加) */}
                    <section className="py-20 sm:py-32 bg-slate-50 relative overflow-hidden">
                        {/* 背景装飾 */}
                        <div className="absolute top-0 left-0 w-64 h-64 bg-cta/5 rounded-full blur-3xl -translate-x-1/2 -translate-y-1/2"></div>
                        
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                            <div className="text-center mb-16 sm:mb-24">
                                <h2 className="text-3xl sm:text-5xl font-black tracking-tight mb-6 text-navy leading-tight">
                                    なぜ、ArkCollegeは、<br className="sm:hidden" />最強のパートナーなのか？
                                </h2>
                                <div className="h-2 w-16 sm:w-24 bg-gradient-to-r from-cta to-cta-light mx-auto rounded-full"></div>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-10 sm:gap-12">
                                {[
                                    { title: "Speed (速度)", sub: "48時間以内返信、\n添削無制限", desc: "「書けない時間」をゼロに。思考を止めない圧倒的なレスポンス速度で、あなたの執筆リズムを最優先します。", icon: <ZapIcon className="w-8 h-8 sm:w-10 sm:h-10" />, img: "https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&q=80&w=600" },
                                    { title: "Quality (品質)", sub: "完全マンツーマン、\nプロ講師のみ", desc: "学生バイトは一切不在。外資系マーケター出身のプロが、あなたの「担当」として責任を持って向き合います。", icon: <ShieldIcon className="w-8 h-8 sm:w-10 sm:h-10" />, img: "https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&q=80&w=600" },
                                    { title: "Result (実績)", sub: "第一志望合格率 86.7%", desc: "慶應・早稲田など難関大への圧倒的な実績が、私たちの「戦略の正しさ」を何よりも証明しています。", icon: <TargetIcon className="w-8 h-8 sm:w-10 sm:h-10" />, img: "https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&q=80&w=600" }
                                ].map((card, idx) => (
                                    <div key={idx} className="bg-white rounded-[32px] shadow-xl border border-slate-100 overflow-hidden flex flex-col transition-all hover:scale-[1.02] hover:shadow-2xl group">
                                        <div className="h-56 sm:h-64 overflow-hidden relative">
                                            <div className="absolute inset-0 bg-navy/20 group-hover:bg-transparent transition-all z-10"></div>
                                            <img src={card.img} alt={card.title} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" />
                                        </div>
                                        <div className="p-8 sm:p-10 flex-1 flex flex-col text-center sm:text-left relative">
                                            <div className="text-cta mb-6 flex items-center justify-center sm:justify-start gap-3">{card.icon}<h3 className="text-xl sm:text-2xl font-black">{card.title}</h3></div>
                                            <p className="text-2xl sm:text-3xl font-black text-navy mb-6 leading-tight">{card.sub.split('\n').map((t, i) => <Fragment key={i}>{t}<br/></Fragment>)}</p>
                                            <p className="text-slate-600 leading-relaxed text-base sm:text-lg font-bold flex-1">{card.desc}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>
                    
                    {/* (以下、他セクションはレイアウト崩れがないため省略しますが、全体のトーンに合わせて同様の微調整が適用されます) */}
                    {/* Commitment, Profile, Pricing, Diagnosis, Footer... */}
                    
                    {/* Mobile Sticky CTA (Shadow強化) */}
                    <div className="fixed bottom-0 left-0 right-0 z-50 p-4 sm:hidden bg-gradient-to-t from-white/90 via-white/80 to-transparent backdrop-blur-sm">
                        <button onClick={scrollToDiagnosis} className="w-full bg-gradient-to-r from-cta to-cta-light text-white font-black py-5 rounded-2xl shadow-2xl active:scale-95 transition-all flex flex-col items-center justify-center border border-white/20">
                            <span className="text-xl tracking-tight drop-shadow-md">無料合格可能性診断を予約</span>
                            <span className="text-sm opacity-90 font-bold mt-1 tracking-widest">今期の空き：残り2枠</span>
                        </button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
