                                        <input type="text" name="name" className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-xl font-medium focus:border-brand-500 focus:ring-2 focus:ring-brand-200 outline-none transition-all" placeholder="例：山田 太郎" required />

                                    <div className="space-y-3">

                                        </div>
                                    </div>

                                    <div className="space-y-2">
                                        <label className="block font-bold text-slate-700">在籍高校名 <span className="text-accent-500 text-xs ml-1">必須</span></label>
                                        <input type="text" name="highschool" className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-xl font-medium focus:border-brand-500 focus:ring-2 focus:ring-brand-200 outline-none transition-all" placeholder="例：〇〇高等学校" required />
                                    </div>

                                    <button type="submit" className="btn-shine w-full bg-brand-600 text-white text-xl font-bold py-5 rounded-2xl shadow-blue hover:bg-brand-700 hover:shadow-lg hover:-translate-y-1 transition-all mt-6">

                                    </button>
                                </form>
                                
                                <div className="mt-12 text-center">
                                    <p className="text-slate-400 text-sm font-bold mb-4">LINEでの相談も可能です</p>
                                    <a href="https://lin.ee/Uq7uW97" target="_blank" className="inline-flex items-center justify-center gap-2 w-full max-w-sm bg-[#06C755] hover:bg-[#05b54c] text-white font-bold py-4 rounded-xl transition-colors">
                                        LINEで資料請求・相談
                                    </a>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="py-12 bg-white border-t border-slate-100 text-center pb-32 sm:pb-12">
                        <div className="font-bold text-brand-700 text-xl mb-8 flex items-center justify-center gap-2">
                             <div className="w-6 h-6 bg-brand-600 rounded"></div>
                             Ark College
                        </div>
                        <div className="flex flex-wrap justify-center gap-6 mb-8 text-slate-500 text-sm font-medium">

                        </div>
                        <p className="text-slate-400 text-xs">© 2024 Ark College. All rights reserved.</p>
                    </footer>

                    {/* Mobile Floating CTA */}
                    <div className="fixed bottom-0 left-0 right-0 z-50 p-4 bg-white/90 backdrop-blur border-t border-slate-200 sm:hidden">
                        <button onClick={scrollToDiagnosis} className="btn-shine w-full bg-accent-500 text-white font-bold py-3.5 rounded-xl shadow-orange flex flex-col items-center justify-center leading-tight">
                            <span className="text-lg">無料合格可能性診断を予約</span>
                            <span className="text-[10px] opacity-90 font-medium mt-0.5">残り2枠 / 48時間以内返信</span>
                        </button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
